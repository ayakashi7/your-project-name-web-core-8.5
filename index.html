<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ремонт техники</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
<header class="header"> 
    <h2>Ремонт техники различных брендов</h2>
 </header>
  <body>

    <section class="brands">
      <div class="brands__container">
       
        
          <div class=" brands__list" id="brandsList">
            <div class="swiper-slide brand-item">
              <img class="brand-item__logo" src="img/lenovo.png" alt="Lenovo" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class="brand-item">
              <img class="brand-item__logo" src="img/sam.png" alt="Samsung" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class="brand-item">
              <img class="brand-item__logo" src="img/iphone.png" alt="Apple" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class="brand-item">
              <img
                class="brand-item__logo"
                src="img/view.png"
                alt="ViewSonic"
              />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class=" brand-item">
              <img class="brand-item__logo" src="img/bos.png" alt="Bosch" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class=" brand-item">
              <img class="brand-item__logo" src="img/hp.png" alt="HP" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class=" brand-item">
              <img class="brand-item__logo" src="img/aser.png" alt="Acer" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class="brand-item">
              <img class="brand-item__logo" src="img/sony.png" alt="Sony" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>
          </div>
        </div>
        <div class="read-more" id="brandsBlock">
            <div class="brand-item">
              <img class="brand-item__logo" src="img/lenovo.png" alt="Lenovo" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>
            <div class=" brand-item">
              <img class="brand-item__logo" src="img/sam.png" alt="Samsung" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>

            <div class="brand-item">
              <img class="brand-item__logo" src="img/iphone.png" alt="Apple" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>
            </div>

            <div class="show">
    </div> <button class="brands__expand-btn" id="toggleBrands" type="button">
         <img class="expand-icon" src="icon/icon.svg" alt="" />
          <span class="expand-text">Показать все</span> 
        </button></div>
    </section>
    <!-- swiper -->
     <div class="swiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide">
        <div class="brand-item">
              <img class="brand-item__logo" src="img/iphone.png" alt="Apple" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>
        </div>
    <div class="swiper-slide">
        <div class="brand-item">
              <img class="brand-item__logo" src="img/iphone.png" alt="Apple" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>
        </div>
    <div class="swiper-slide">
        <div class="brand-item">
              <img class="brand-item__logo" src="img/iphone.png" alt="Apple" />
              <button
                class="brand-item__go-btn"
                type="button"
              ></button>
            </div>
        </div>
   </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
